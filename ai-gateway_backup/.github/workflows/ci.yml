name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ai-gateway/backend

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.12"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install black ruff isort mypy
        
    - name: Check formatting with Black
      run: black --check app
      
    - name: Lint with Ruff
      run: ruff check app
      
    - name: Type check with mypy
      run: mypy app
      
    - name: Run tests
      run: pytest tests/
